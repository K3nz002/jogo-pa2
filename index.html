<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Uma mulher desapareceu e o principal suspeito é o marido. Você tem 3 dias para descobrir o que aconteceu. Colete pistas, interrogue suspeitos e faça a justiça.">
    <meta name="keywords" content="jogo, investigação, policial, crime, pista, assassinato, phaser">
    <title>Ainda à Espera</title>

    <!-- Phaser 3 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas gerado pelo Phaser */
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            /* Mantém proporção 16:9 */
            aspect-ratio: 16 / 9;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <script src="./src/main.js" type="module"></script>
</body>
</html>
